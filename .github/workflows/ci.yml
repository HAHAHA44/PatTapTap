name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build # typecheck + bundle

  server:
    name: Server (Docker stack + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > deploy/.env
          docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --env-file deploy/.env up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && exit 0; sleep 2; done
          docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --env-file deploy/.env logs server
          exit 1
      - run: npm test
        working-directory: server
      - name: Server logs
        if: failure()
        run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --env-file deploy/.env logs server
