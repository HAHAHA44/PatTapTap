# Base stack: API server + PostgreSQL + Redis.
# Use together with compose.dev.yml (local) or compose.prod.yml (server), see deploy/README.md.

name: patpattap

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patpattap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: patpattap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patpattap -d patpattap"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://patpattap:${POSTGRES_PASSWORD}@postgres:5432/patpattap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-PatPatTap <no-reply@patpattap.local>}
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,http://localhost:1420}
      DAILY_TZ_OFFSET_MIN: ${DAILY_TZ_OFFSET_MIN:-480}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  redisdata:
